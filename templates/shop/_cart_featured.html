{% load persian %}
{% if featured %}
  <section class="mt-10">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="border-b-2 border-sky-400 pb-1 text-lg font-semibold text-slate-800">محصولات پیشنهادی</h2>
      <a class="text-sm font-medium text-slate-700 transition-colors duration-200 hover:text-cyanbtn" href="{% url 'catalog' %}">مشاهده همه</a>
    </div>
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
      {% for product in featured %}
        <article class="flex h-full flex-col overflow-hidden rounded-xl border border-slate-200 bg-white p-3 transition duration-200 hover:border-cyanbtn/40 hover:shadow-lg">
          <a class="block overflow-hidden rounded-lg bg-slate-50" href="{{ product.get_absolute_url }}">
            {% include "shop/_media.html" with file=product.image alt=product.name label="تصویر محصول" size="card" %}
          </a>
          <a class="mt-3 line-clamp-2 min-h-[44px] text-sm font-medium leading-6 text-slate-800 transition hover:text-cyanbtn" href="{{ product.get_absolute_url }}">{{ product.name }}</a>
          <div class="mt-auto pt-3">
            <p class="mb-3 text-sm font-bold text-slate-900">{{ product.price|fa_num }} <span class="text-xs font-medium text-slate-500">تومان</span></p>
            <form method="post" action="{% url 'add_to_cart' product.slug %}">
              {% csrf_token %}
              <input type="hidden" name="next" value="{% url 'cart' %}">
              <input type="hidden" name="quantity" value="1">
              <button class="inline-flex h-10 w-full items-center justify-center gap-1.5 rounded-lg bg-cyanbtn text-sm font-bold text-white transition hover:bg-cyanbtnHover" type="submit">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h2l1.2 9.2a2 2 0 0 0 2 1.8h7.6a2 2 0 0 0 2-1.6L20 8H7"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>
                افزودن به سبد
              </button>
            </form>
          </div>
        </article>
      {% endfor %}
    </div>
  </section>
{% endif %}
