<figure class="{% if size == 'thumb' %}h-[72px] w-[72px] shrink-0 rounded-lg{% elif size == 'basket' %}h-[110px] w-full rounded-lg{% elif size == 'hero' %}min-h-[240px] w-full{% elif size == 'detail' %}min-h-[320px] w-full{% elif size == 'wide' %}mb-6 min-h-[240px] w-full{% elif size == 'category' %}h-[140px] w-full rounded-xl md:h-[180px] xl:h-[200px]{% else %}relative h-[213px] w-full overflow-hidden rounded-lg{% endif %} m-0 grid place-items-center overflow-hidden bg-slate-100">
  {% if file %}
    <img src="{{ file.url }}" alt="{{ alt }}" class="h-full w-full {% if size == 'category' %}object-cover transition duration-300 ease-out group-hover:scale-[1.03]{% elif size == 'card' %}object-contain transition duration-200 group-hover:scale-[1.04]{% else %}object-contain{% endif %}">
  {% else %}
    <span class="px-3 text-center text-sm text-slate-500">{{ label|default:"محل قرارگیری تصویر" }}</span>
  {% endif %}
</figure>
