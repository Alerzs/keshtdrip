{% load static %}
<div class="w-full font-sans">
  <div id="kd-finder" class="relative mx-auto aspect-[1280/470] w-full overflow-hidden rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.12)] xl:rounded-md" dir="ltr">
    <div class="kd-finder-viewport absolute inset-0 w-full cursor-grab overflow-hidden touch-pan-y select-none">
      <div class="kd-finder-track absolute inset-0 flex transition-transform duration-700 ease-out" style="transform: translateX(0%)">
        <a href="{% url 'catalog' %}" class="block h-full cursor-pointer">
          <img src="{% static 'img/head1-w1280.webp' %}?v=6" srcset="{% static 'img/head1-w800.webp' %}?v=6 800w, {% static 'img/head1-w1280.webp' %}?v=6 1280w" sizes="100vw" alt="بزرگترین فروشگاه لوازم آبیاری قطره‌ای" width="1280" height="470" fetchpriority="high" decoding="async" draggable="false" class="pointer-events-none">
        </a>
        <a href="{% url 'catalog' %}?category=chemical-fertilizer" class="block h-full cursor-pointer">
          <img src="{% static 'img/head2-w1280.webp' %}?v=6" srcset="{% static 'img/head2-w800.webp' %}?v=6 800w, {% static 'img/head2-w1280.webp' %}?v=6 1280w" sizes="100vw" alt="عرضه سم و کود صنعتی" width="1280" height="470" loading="lazy" decoding="async" draggable="false" class="pointer-events-none">
        </a>
        <a href="{% url 'catalog' %}?category=drip-tape" class="block h-full cursor-pointer">
          <img src="{% static 'img/drip-banner-w1280.webp' %}?v=5" srcset="{% static 'img/drip-banner-w800.webp' %}?v=5 800w, {% static 'img/drip-banner-w1280.webp' %}?v=5 1280w" sizes="100vw" alt="نوارتیپ آبیاری قطره‌ای" width="1280" height="470" loading="lazy" decoding="async" draggable="false" class="pointer-events-none">
        </a>
        <a href="{% url 'blog' %}" class="block h-full cursor-pointer">
          <img src="{% static 'img/drip-banner2-w1280.webp' %}?v=10" srcset="{% static 'img/drip-banner2-w800.webp' %}?v=10 800w, {% static 'img/drip-banner2-w1280.webp' %}?v=10 1280w" sizes="100vw" alt="راهی هوشمند برای کشاورزی پایدار" width="1280" height="470" loading="lazy" decoding="async" draggable="false" class="pointer-events-none">
        </a>
      </div>
    </div>

    <div class="pointer-events-none absolute inset-y-0 left-0 z-10 hidden w-[30%] xl:block">
      <div class="kd-finder-veil absolute inset-y-0 left-0" aria-hidden="true"></div>
      <div class="relative grid h-full min-h-0 grid-cols-1 grid-rows-2 gap-2 p-2 xl:gap-3 xl:p-3">
        <a href="{% url 'catalog' %}" class="kd-finder-card pointer-events-auto relative h-full min-h-0 overflow-hidden shadow-[0_10px_28px_rgba(0,0,0,0.08)] transition hover:shadow-lg">
          <img src="{% static 'img/head3-w800.webp' %}" alt="خرید لوازم آبیاری کشت‌دریپ" width="800" height="533" loading="lazy" decoding="async" class="h-full w-full object-cover">
        </a>
        <a href="{% url 'catalog' %}" class="kd-finder-card pointer-events-auto relative h-full min-h-0 overflow-hidden shadow-[0_10px_28px_rgba(0,0,0,0.08)] transition hover:shadow-lg">
          <img src="{% static 'img/head4-w800.webp' %}" alt="تجهیزات آبیاری قطره‌ای" width="800" height="533" loading="lazy" decoding="async" class="h-full w-full object-cover">
        </a>
      </div>
    </div>

    <button type="button" class="kd-finder-prev absolute top-1/2 left-1 z-20 grid h-10 w-10 -translate-y-1/2 place-items-center text-white drop-shadow-[0_2px_8px_rgba(0,0,0,0.55)] transition-all duration-300 ease-out hover:-translate-x-1 hover:-translate-y-1/2 hover:scale-125 hover:text-cyanbtn xl:left-[calc(30%+0.75rem)] xl:h-12 xl:w-12" aria-label="اسلاید قبلی">
      <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <button type="button" class="kd-finder-next absolute top-1/2 right-1 z-20 grid h-10 w-10 -translate-y-1/2 place-items-center text-white drop-shadow-[0_2px_8px_rgba(0,0,0,0.55)] transition-all duration-300 ease-out hover:translate-x-1 hover:-translate-y-1/2 hover:scale-125 hover:text-cyanbtn xl:right-2 xl:h-12 xl:w-12" aria-label="اسلاید بعدی">
      <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </button>

    <div class="pointer-events-none absolute right-0 bottom-0 left-0 z-20 flex justify-center bg-gradient-to-t from-black/20 to-transparent pb-1.5 pt-4 xl:left-[30%] xl:from-black/35 xl:pb-4 xl:pt-10">
      <div class="pointer-events-auto flex items-center gap-1.5" role="tablist" aria-label="اسلایدها">
        <button type="button" class="kd-finder-dot h-1.5 w-6 rounded-full bg-white transition-all duration-300 ease-out hover:bg-white" data-index="0" aria-label="اسلاید 1"></button>
        <button type="button" class="kd-finder-dot h-1.5 w-1.5 rounded-full bg-white/45 transition-all duration-300 ease-out hover:bg-white/80" data-index="1" aria-label="اسلاید 2"></button>
        <button type="button" class="kd-finder-dot h-1.5 w-1.5 rounded-full bg-white/45 transition-all duration-300 ease-out hover:bg-white/80" data-index="2" aria-label="اسلاید 3"></button>
        <button type="button" class="kd-finder-dot h-1.5 w-1.5 rounded-full bg-white/45 transition-all duration-300 ease-out hover:bg-white/80" data-index="3" aria-label="اسلاید 4"></button>
      </div>
    </div>
  </div>

  <div class="mt-3 grid grid-cols-2 gap-2 xl:hidden" dir="rtl">
    <a href="{% url 'catalog' %}" class="overflow-hidden rounded-xl shadow-[0_8px_24px_rgba(15,23,42,0.08)]">
      <img src="{% static 'img/head3-w800.webp' %}" alt="خرید لوازم آبیاری کشت‌دریپ" width="800" height="533" loading="lazy" decoding="async" class="aspect-[4/3] h-full w-full object-cover">
    </a>
    <a href="{% url 'catalog' %}" class="overflow-hidden rounded-xl shadow-[0_8px_24px_rgba(15,23,42,0.08)]">
      <img src="{% static 'img/head4-w800.webp' %}" alt="تجهیزات آبیاری قطره‌ای" width="800" height="533" loading="lazy" decoding="async" class="aspect-[4/3] h-full w-full object-cover">
    </a>
  </div>

  <div class="mt-3 grid grid-cols-2 gap-2 lg:grid-cols-4 lg:mt-4 lg:gap-3" dir="rtl">
    <a href="{% url 'about' %}#kd-service-delivery" class="group flex min-w-0 flex-col items-center gap-2 rounded-2xl border border-slate-200 bg-white px-2 py-3 text-center shadow-[0_8px_24px_rgba(15,23,42,0.05)] transition hover:-translate-y-0.5 hover:border-cyanbtn hover:shadow-md xl:flex-row xl:gap-3 xl:px-4 xl:py-4 xl:text-right">
    <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-cyanbtn/10 text-cyanbtn transition group-hover:bg-cyanbtn group-hover:text-white md:h-12 md:w-12">
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M12 21V11"></path>
        <path d="M12 14c-4.5 0-7-2.5-7-7 4.5 0 7 2.5 7 7Z"></path>
        <path d="M12 11c0-4 2.5-6 6.5-6 0 4-2.5 6-6.5 6Z"></path>
        <path d="m15.5 17 2 2 4-4"></path>
      </svg>
    </span>
      <span class="min-w-0">
        <strong class="block text-sm font-bold text-slate-800">گارانتی کشت</strong>
        <span class="mt-0.5 hidden text-xs text-slate-500 xl:block">یک کشت ضمانت تمامی نوار تیپ ها</span>
      </span>
    </a>
    <a href="{% url 'about' %}#kd-service-warranty" class="group flex min-w-0 flex-col items-center gap-2 rounded-2xl border border-slate-200 bg-white px-2 py-3 text-center shadow-[0_8px_24px_rgba(15,23,42,0.05)] transition hover:-translate-y-0.5 hover:border-cyanbtn hover:shadow-md xl:flex-row xl:gap-3 xl:px-4 xl:py-4 xl:text-right">
    <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-cyanbtn/10 text-cyanbtn transition group-hover:bg-cyanbtn group-hover:text-white md:h-12 md:w-12">
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M12 3 20 6v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3Z"></path>
        <path d="m8.5 12 2.2 2.2 4.8-5"></path>
      </svg>
    </span>
      <span class="min-w-0">
        <strong class="block text-sm font-bold text-slate-800">گارانتی اصالت</strong>
        <span class="mt-0.5 hidden text-xs text-slate-500 xl:block">ضمانت اصالت کالا و کیفیت فنی</span>
      </span>
    </a>
    <a href="{% url 'about' %}#kd-service-return" class="group flex min-w-0 flex-col items-center gap-2 rounded-2xl border border-slate-200 bg-white px-2 py-3 text-center shadow-[0_8px_24px_rgba(15,23,42,0.05)] transition hover:-translate-y-0.5 hover:border-cyanbtn hover:shadow-md xl:flex-row xl:gap-3 xl:px-4 xl:py-4 xl:text-right">
    <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-cyanbtn/10 text-cyanbtn transition group-hover:bg-cyanbtn group-hover:text-white md:h-12 md:w-12">
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M3 9h18"></path>
        <path d="M5 9v10h14V9"></path>
        <path d="M4 9 6 4h12l2 5"></path>
        <path d="M8 19v-5h8v5"></path>
        <path d="M9 4v5M15 4v5"></path>
      </svg>
    </span>
      <span class="min-w-0">
        <strong class="block text-sm font-bold text-slate-800">خرید بدون واسطه</strong>
        <span class="mt-0.5 hidden text-xs text-slate-500 xl:block">ارسال محصولات از درب کارخانه بدون واسطه</span>
      </span>
    </a>
    <a href="{% url 'about' %}#kd-service-support" class="group flex min-w-0 flex-col items-center gap-2 rounded-2xl border border-slate-200 bg-white px-2 py-3 text-center shadow-[0_8px_24px_rgba(15,23,42,0.05)] transition hover:-translate-y-0.5 hover:border-cyanbtn hover:shadow-md xl:flex-row xl:gap-3 xl:px-4 xl:py-4 xl:text-right">
    <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-cyanbtn/10 text-cyanbtn transition group-hover:bg-cyanbtn group-hover:text-white md:h-12 md:w-12">
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M3 10h18"></path>
        <path d="M7 15h3"></path>
        <circle cx="17" cy="15" r="2"></circle>
      </svg>
    </span>
      <span class="min-w-0">
        <strong class="block text-sm font-bold text-slate-800">فروش نقدی و اقساطی</strong>
        <span class="mt-0.5 hidden text-xs text-slate-500 xl:block">فروش شرایطی و اقساطی تمامی محصولات</span>
      </span>
    </a>
  </div>
</div>
