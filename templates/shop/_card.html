{% load persian %}
<a class="{% if layout == 'grid' %}flex h-full w-full flex-col items-center gap-4 bg-white p-4{% else %}flex h-full w-[250px] shrink-0 flex-col items-center gap-4 bg-white p-4{% endif %} group overflow-hidden rounded-xl border border-transparent transition duration-200 hover:-translate-y-0.5 hover:border-cyanbtn/40 hover:shadow-lg" href="{{ product.get_absolute_url }}">
  {% include "shop/_media.html" with file=product.image alt=product.name label="تصویر محصول" size="card" %}
  <span class="line-clamp-2 h-[45px] w-full font-medium text-slate-800 md:h-[52px]">{{ product.name }}</span>
  <div class="mt-auto flex flex-col items-start self-start">
    {% if product.category %}
      <span class="mb-1 rounded-md border border-slate-200 px-2 py-0.5 text-xs text-slate-500">{{ product.category }}</span>
    {% else %}
      <div class="h-6"></div>
    {% endif %}
    <div class="flex flex-row items-center gap-x-2 text-right text-slate-800">
      <span class="flex items-center text-lg font-bold">{{ product.price|fa_num }}</span>
      <span class="mb-0.5 text-sm">تومان</span>
    </div>
  </div>
</a>
